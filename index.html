
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Dinner 2026</title>

  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e7f6ff;
      color: #0056b3;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
      text-transform: uppercase;
    }

    p {
      font-size: 1.3rem;
      margin-top: 10px;
      margin-bottom: 30px;
      color: #007bff;
    }

    .container {
      background: rgba(0, 123, 255, 0.04);
      border: 1px solid #007bff;
      padding: 40px;
      border-radius: 10px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.15);
    }

    /* Styled Poll Links */
    .poll-link {
      display: block;
      background-color: #ffffff;
      color: #007bff;
      text-decoration: none;
      border: 2px solid #007bff;
      border-radius: 5px;
      padding: 12px 25px;
      margin: 10px 0;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.1);
    }

    .poll-link:hover {
      background-color: #007bff;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.35);
      transform: translateY(-3px);
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .container {
        width: 90%;
        padding: 25px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1.1rem;
      }

      .poll-link {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Senior Dinner 2026</h1>
    <p>Below are the voting polls</p>

    <a href="https://app.sli.do/event/kor6z9BkrK8ffF6Y9Ud7hi/embed/polls/29a8705d-66f9-4b44-9aee-16d442e5fd24"
       class="poll-link" target="_blank" rel="noopener noreferrer">
      Guess the teacher
    </a>

    <a href="https://app.polling.com/forms/9f64a99b-a18a-4f77-adb9-11972c4db2ac/share"
       class="poll-link" target="_blank" rel="noopener noreferrer">
      Best Dressed Girl
    </a>

    <a href="https://app.polling.com/forms/dfafcbf7-7639-4a8c-aa2c-7030875a4d7a/share"
       class="poll-link" target="_blank" rel="noopener noreferrer">
      Best Dressed Guy
    </a>

    <a href="https://app.polling.com/forms/c67dd3fd-aef9-459a-bc4d-374c5e2b06a4/share"
       class="poll-link" target="_blank" rel="noopener noreferrer">
      Best Dressed Male Teacher
    </a>

    <a href="https://app.polling.com/forms/98b1f384-0ea7-490f-afc3-3c9dd7667549/share"
       class="poll-link" target="_blank" rel="noopener noreferrer">
      Best Dressed Female Teacher
    </a>
  </div>
</body>
</html>
